name: Build paseo-custom

on:
  schedule:
    - cron: "23 */6 * * *"      # every 6 hours; the check below makes it cheap
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/build.yml]   # your own edits always rebuild
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  BASE_IMAGE: ghcr.io/getpaseo/paseo:latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Has upstream changed?
        id: check
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"   # owner/repo, lowercased (ghcr requires it)
          digest="$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{json .Manifest}}' | jq -r .digest)"
          short="${digest#sha256:}"; short="${short:0:12}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"

          # Skip only if this isn't a push and we already built on this exact base.
          if [ "$GITHUB_EVENT_NAME" != push ] \
             && docker buildx imagetools inspect "$image:base-$short" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Already built on base $short, nothing to do."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.build == 'true'
        with:
          context: .
          pull: true            # always re-pull the FROM image
          push: true
          tags: |
            ${{ steps.check.outputs.image }}:latest
            ${{ steps.check.outputs.image }}:base-${{ steps.check.outputs.short }}
