name: Build paseo (stable + PR)

on:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/build.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  UPSTREAM: https://github.com/getpaseo/paseo
  PR: "9704"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Has anything changed?
        id: check
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # newest stable vX.Y.Z tag (betas excluded)
          tag="$(git ls-remote --tags --refs --sort=-v:refname "$UPSTREAM" \
                 | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '1p')"
          # current head commit of the PR
          pr_sha="$(git ls-remote "$UPSTREAM" "refs/pull/$PR/head" | cut -f1)"
          if [ -z "$tag" ] || [ -z "$pr_sha" ]; then
            echo "Could not resolve a stable tag or the PR head" >&2
            exit 1
          fi

          key="${tag}-pr${PR}-${pr_sha:0:7}"
          echo "image=$image"  >> "$GITHUB_OUTPUT"
          echo "tag=$tag"      >> "$GITHUB_OUTPUT"
          echo "pr_sha=$pr_sha" >> "$GITHUB_OUTPUT"
          echo "key=$key"      >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" != push ] \
             && docker buildx imagetools inspect "$image:src-$key" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Already built $key, nothing to do."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      # fetch-depth 0: `git apply --3way` needs the base blobs from history.
      - uses: actions/checkout@v4
        if: steps.check.outputs.build == 'true'
        with:
          repository: getpaseo/paseo
          ref: ${{ steps.check.outputs.tag }}
          path: upstream
          fetch-depth: 0
          persist-credentials: false

      - name: Apply the PR
        if: steps.check.outputs.build == 'true'
        working-directory: upstream
        env:
          EXPECTED_SHA: ${{ steps.check.outputs.pr_sha }}
        run: |
          set -euo pipefail
          # fetch the recorded head and generate the patch locally, so the
          # applied diff is bound to EXPECTED_SHA by construction
          git fetch origin "$EXPECTED_SHA"
          head_sha="$(git rev-parse FETCH_HEAD)"
          git fetch origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          mb="$(git merge-base "$head_sha" "$main_sha")"
          git diff "$mb" "$head_sha" > /tmp/pr.diff
          git apply --3way /tmp/pr.diff

      - name: Build upstream, then your layer on top
        if: steps.check.outputs.build == 'true'
        run: |
          image="${{ steps.check.outputs.image }}"
          docker build -f upstream/docker/base/Dockerfile -t paseo-base:local upstream
          docker build --build-arg BASE_IMAGE=paseo-base:local \
            -t "$image:latest" -t "$image:src-${{ steps.check.outputs.key }}" .
          docker push --all-tags "$image"
